org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
# 这台 VPS 只有 3.6Gi 物理内存（cgroup 无上限，是真的机器小）。
# 原来 -Xmx2048m + Metaspace512m + CodeCache96m 单个 JVM 就要 ~2.6G，
# 而构建时可用约 2.5G，Gradle 的 java 进程被内核 OOM killer 杀掉，
# 表现为「Gradle build daemon disappeared unexpectedly」。
# 降到 1280m 留出余量；kotlin 已是 in-process，不再单独给 daemon 堆。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=64m
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.compiler.execution.strategy=in-process
