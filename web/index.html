<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO -->
  <meta name="description" content="Geek工具箱 — 全能的极客工具集，集成 AI 生图工坊、插件扩展、内容管理、远程运维等能力">
  <meta name="keywords" content="Geek工具箱,AI生图,工具箱,极客工具,Flutter应用">
  <meta name="author" content="HePingan">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / 社交媒体分享 -->
  <meta property="og:title" content="Geek工具箱 Pro">
  <meta property="og:description" content="全能的极客工具集 — AI 生图工坊、插件扩展、内容管理、远程运维">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://github.com/HePingan/box">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS / Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Geek工具箱">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- 主题色 -->
  <meta name="theme-color" content="#1a1a2e">
  <meta name="msapplication-TileColor" content="#1a1a2e">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Geek工具箱 Pro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4fc3f7, #2196f3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      box-shadow: 0 8px 32px rgba(33, 150, 243, 0.3);
      margin-bottom: 24px;
    }

    .splash-title {
      color: white;
      font-size: 22px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 1px;
      margin-bottom: 32px;
    }

    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

    flutter-view, flt-scene, canvas { width: 100%; height: 100%; display: block; }
    ::selection { background: rgba(33, 150, 243, 0.25); }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">G</div>
    <div class="splash-title">Geek工具箱</div>
    <div class="splash-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    const splash = document.getElementById('splash');
    function hideSplash() {
      if (!splash || splash.classList.contains('hidden')) return;
      splash.classList.add('hidden');
      setTimeout(() => { splash.style.display = 'none'; }, 500);
    }
    const obs = new MutationObserver(() => {
      if (document.querySelector('canvas[aria-hidden]')) hideSplash();
    });
    obs.observe(document.body, { childList: true, subtree: true });
    document.addEventListener('flutter-first-frame', hideSplash);
    setTimeout(hideSplash, 6000);
  </script>
</body>
</html>
